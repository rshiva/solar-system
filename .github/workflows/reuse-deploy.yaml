name: Deployment - reusable workflow

on:
  workflow_call:
    secrets:
      k8s-kubeconfig:
        required: true
      mongodb-password:
        required: true
    inputs:
      mongodb-uri:
        required: true
        type: string
      environment:
        required: true
        type: string
        default: development
      k8s-manifest-dir:
        required: true
        type: string
      kubectl-version:
        required: false
        type: string
        default: 'v1.26.0'
    outputs:
      application-url: 
        description: "The application's public URL."
        value: ${{ jobs.reuse-deploy.outputs.APP_INGRESS_URL}}


jobs:
  reuse-deploy:
    runs-on: ubuntu-latest
    environment: 
      name: ${{inputs.environment}}
      url: https://${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST}}
    outputs:
      APP_INGRESS_URL: ${{ steps.set-ingress-host-address.outputs.APP_INGRESS_HOST}}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
           version: 'v1.26.0' 

      - name: Set Kubeconfig file
        uses: azure/k8s-set-context@v4
        with:
           method: kubeconfig
           kubeconfig: ${{ secrets.k8s-kubeconfig }}

      - name: Fetch kubernetes Cluster details
        run: |
          kubectl version
          echo ----------------------
          kubectl get nodes



      - name: Fetch Nginx ingress controller IP as runner environment variable
        run: |
          echo "INGRESS_IP=$( k -n ingress-nginx get svc ingress-nginx-controller -o jsonpath="{.status.loadbalancer.ingress[0].ip}")" >> "$GITHUB_ENV"

      - name: Replace token in manifest files
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '_{_'
          tokenSuffix: '_}_'
          files: '["${{ inputs.k8s-manifest-dir}}*.yaml"]'
        env:
          NAMESPACE: ${{ vars.NAMESPACE }}
          REPLICAS: ${{ vars.REPLICAS}}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME}}/solar-system:${{ github.sha }}
          INGRESS_IP: ${{env.INGRESS_IP }}

      - name: Check files
        run: |
          cat kubernetes/${{ inputs.environment}}.yaml

      - name: Create Mongodb secret
        run: |
          kubectl create -n ${{vars.NAMESPACE}} secret generic mongo-db=creds \
          --from-literal=MONGO_URI=${{ inputs.mongodb-uri}} \
          --from-literal=MONGO_USERNAME=${{vars.MONGO_USERNAME}} \
          --from-literal=MONGO_PASSWORD=${{ secrets.mongodb-password }} \
          --save-config \
          --dry-run=client \
          -o yaml | kubectl apply -f -

      - name : Deploy to Dev env
        run: |
          kubectl apply -f kubernetes/${{inputs.environment}}

      - name: Set APP Ingress Host URL
        id: set-ingress-host-address
        run: |
            echo "APP_INGRESS_HOST=$(kubectl -n ${{ vars.NAMESPACE }} get ingress -o jsonpath="{.items[0].spec.tls[0].hosts[0]}")" >> "$GITHUB_ENV"