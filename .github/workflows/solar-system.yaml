name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
  # using service container
  unit-testing:
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
        env:
          MONGO_URI: 'mongodb://localhost:27017/superData'
          MONGO_USERNAME: ${{vars.MONGO_TEST_USERNAME}}
          MONGO_PASSWORD: ${{ secrets.MONGO_TEST_PASSWORD }}
        
    strategy:
      matrix:
        nodejs_version: [18,20]
        operating_systems: [ubuntu-latest]
        exclude:
          - nodejs_version: 18
            operating_systems: macos-latest
    name: Unit Testing
    runs-on: ${{matrix.operating_systems}}

    steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name: Install NodeJs version - ${{matrix.nodejs_version}}
      uses: actions/setup-node@v3
      with:
        node-version: ${{matrix.nodejs_version}}

    - name: Cache NPM Dependencies
      uses: actions/cache@v3
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}

    - name: Install Dependencies
      run: npm install
    
    - name: unity testing
      id: nodejs-unit-testing-step
      run: npm test
      env:
        MONGO_URI: mongodb://localhost:27017/superData
        MONGO_USERNAME: ${{ vars.MONGO_TEST_USERNAME }}
        MONGO_PASSWORD: ${{ secrets.MONGO_TEST_PASSWORD }}

    - name: Archive Test Results
      # if: failure() && (steps.nodejs-unit-testing-step.outcome ==  'failure' || steps.nodejs-unit-testing-step.outcome == 'success')
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: moch-test-result-${{matrix.operating_systems}}-${{matrix.nodejs_version}}
        path: test-results.xml
    
  # using both service and job container      
  code-coverage:
    name: code coverage
    container: 
      image: node:18
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        options:
          --name mongo
        env:
          MONGO_URI: 'mongodb://mongo:27017/superData' #service --name mongo
          MONGO_USERNAME: ${{vars.MONGO_TEST_USERNAME}}
          MONGO_PASSWORD: ${{ secrets.MONGO_TEST_PASSWORD }}
    
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # - name: Setup NodeJs Version 18
    #   uses: actions/setup-node@v3
    #   with:
    #     node-version: 18

    - name: Cache NPM dependencies
      uses: actions/cache@v3
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}

    - name: Install Dependencies
      run: npm install

    - name: Check Code Coverage
      continue-on-error: true
      run: npm run coverage

    - name: Archive Test Result
      uses: actions/upload-artifact@v4
      with:
        name: Code-Coverage-Result
        path: coverage
        retention-days: 5
 
  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    permissions: 
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build Testing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME}}/solar-system:${{ github.sha }}

      - name: Docker Image Testing
        run: |
          docker images
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          echo "Testing Image url using wget"
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Docker Push
        uses: docker/build-push-action@v6
        with: 
          context: .
          push: true
          tags: |
              ${{ vars.DOCKERHUB_USERNAME}}/solar-system:${{ github.sha }}
              ghcr.io/${{ github.repository_owner}}/solar-system:${{ github.sha }}

  
  # Deploy in dev env
  dev-deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
           version: 'v1.26.0' 
        
