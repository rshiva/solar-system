name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{vars.MONGO_USERNAME}}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
  # using service container
  unit-testing:
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
        env:
          MONGO_URI: 'mongodb://localhost:27017/superData'
          MONGO_USERNAME: ${{vars.MONGO_TEST_USERNAME}}
          MONGO_PASSWORD: ${{ secrets.MONGO_TEST_PASSWORD }}
        
    strategy:
      matrix:
        nodejs_version: [18,20]
        operating_systems: [ubuntu-latest]
        exclude:
          - nodejs_version: 18
            operating_systems: macos-latest
    name: Unit Testing
    runs-on: ${{matrix.operating_systems}}

    steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name: Install NodeJs version - ${{matrix.nodejs_version}}
      uses: actions/setup-node@v3
      with:
        node-version: ${{matrix.nodejs_version}}

    - name: Composite action - Install and Cache NPM module
      uses: ./.github/custom-actions/npm-action/
      with:
        path-of-folder: node_modules
      
    - name: unity testing
      id: nodejs-unit-testing-step
      run: npm test
      env:
        MONGO_URI: mongodb://localhost:27017/superData
        MONGO_USERNAME: ${{ vars.MONGO_TEST_USERNAME }}
        MONGO_PASSWORD: ${{ secrets.MONGO_TEST_PASSWORD }}

    - name: Archive Test Results
      # if: failure() && (steps.nodejs-unit-testing-step.outcome ==  'failure' || steps.nodejs-unit-testing-step.outcome == 'success')
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: moch-test-result-${{matrix.operating_systems}}-${{matrix.nodejs_version}}
        path: test-results.xml
    
  # using both service and job container      
  code-coverage:
    name: code coverage
    container: 
      image: node:18
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        options:
          --name mongo
        env:
          MONGO_URI: 'mongodb://mongo:27017/superData' #service --name mongo
          MONGO_USERNAME: ${{vars.MONGO_TEST_USERNAME}}
          MONGO_PASSWORD: ${{ secrets.MONGO_TEST_PASSWORD }}
    
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # - name: Setup NodeJs Version 18
    #   uses: actions/setup-node@v3
    #   with:
    #     node-version: 18

    - name: Composite action - Install and Cache NPM module
      uses: ./.github/custom-actions/npm-action/
      with:
        path-of-folder: node_modules

    - name: Check Code Coverage
      continue-on-error: true
      run: npm run coverage

    - name: Archive Test Result
      uses: actions/upload-artifact@v4
      with:
        name: Code-Coverage-Result
        path: coverage
        retention-days: 5
 
  reports-s3:
    name: AWS S3 - upload reports
    runs-on: ubuntu-latest
    needs: [code-coverage, unit-testing]
    steps:
      - name: Download Code Coverage  Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Code-Coverage-Result

      - name: Download Mocha Test Artifacts
        uses: actions/download-artifact@v4
        with:
          name: moch-test-result-ubuntu-20.x

      - name: Merge Test Files
        run: |
          ls -ltr
          mkdir reports-${{ github.sha }}
          mv cobertura-coverage.xml reports-${{ github.sha }}/
          mv test-results.xml reports-${{ github.sha }}
          ls -ltr reports-${{ github.sh }}
      
      - name: Upload to AWS S3
        uses: jakejarvis/s3-sync-action@master 
        with:
          args: --acl public-read --follow-symlinks --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-west-1'   # optional: defaults to us-east-1
          SOURCE_DIR: 'reports-${{github.sha}}'      # optional: defaults to entire repository
          DEST_DIR: 'reports-${{github.sha}}' 

  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    permissions: 
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build Testing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME}}/solar-system:${{ github.sha }}

      - name: Docker Image Testing
        run: |
          docker images
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            -e MONGO_URI=$MONGO_URI \
            -e MONGO_PASSWORD=$MONGO_PASSWORD \
            -e MONGO_USERNAME=$MONGO_USERNAME \
            ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}

          echo "Testing Image url using wget"
          wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Docker Push
        uses: docker/build-push-action@v6
        with: 
          context: .
          push: true
          tags: |
              ${{ vars.DOCKERHUB_USERNAME}}/solar-system:${{ github.sha }}
              ghcr.io/${{ github.repository_owner}}/solar-system:${{ github.sha }}
 
  # Deploy in Dev env
  dev-deploy:
    if: contains(github.ref,'feature')
    needs: docker
    uses: ./.github/workflows/reuse-deploy.yaml
    # using environment variables created in github repo setting
    secrets:
      k8s-kubeconfig: ${{ secrets.KUBECONFIG}}
      mongodb-password: ${{ secrets.MONGO_PASSWORD}}
    with:
      mongodb-uri: ${{ vars.MONGO_URI}}
      environment: development
      k8s-manifest-dir: kubernetes/development/
      


  #dev integration-testing
  dev-integration-testing:
    name: Dev integration testin
    if: contains(github.ref,'feature')
    needs: dev-deploy          
    runs-on: ubuntu-latest
    steps:
      - name: Test URL output using CURL and JQ
        env:
          URL: ${{ needs.dev-deploy.outputs.application-url}}
        run: |
          echo $URL
          echo "--------------------------------"
          curl https://$URL/live -s -k | jq -r .status | grep -i live

  # Deploy in Prod env
  prod-deploy:
    if: github.ref == 'refs/heads/main'
    needs: docker
    # using environment variables created in github repo setting
    uses: ./.github/workflows/reuse-deploy.yaml
    secrets:
      k8s-kubeconfig: ${{ secrets.KUBECONFIG}}
      mongodb-password: ${{ secrets.MONGO_PASSWORD}}
    with:
      mongodb-uri: ${{ vars.MONGO_URI}}
      environment: production
      k8s-manifest-dir: kubernetes/productions/


  #prod integration-testing
  prod-integration-testing:
    if: github.ref == 'refs/heads/main'
    name: Prod integration testin
    needs: prod-deploy          
    runs-on: ubuntu-latest
    steps:
      - name: Test URL output using CURL and JQ
        env:
          URL: ${{ needs.prod-deploy.outputs.application-url}}
        run: |
          echo $URL
          echo "--------------------------------"
          curl https://$URL/live -s -k | jq -r .status | grep -i live

